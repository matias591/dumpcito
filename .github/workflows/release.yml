# Push a tag like v1.0.0 to build both apps and attach them to a draft GitHub release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: scripts/make-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/Dumpcito.zip
            build/Dumpcito.zip.sha256
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test windows/tests/Dumpcito.Core.Tests -c Release
      - run: dotnet publish windows/src/Dumpcito.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out
      - shell: pwsh
        run: |
          Compress-Archive -Path out/Dumpcito.exe -DestinationPath Dumpcito-windows-x64.zip
          (Get-FileHash Dumpcito-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  Dumpcito-windows-x64.zip" | Out-File -Encoding ascii Dumpcito-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Dumpcito-windows-x64.zip
            Dumpcito-windows-x64.zip.sha256
  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            macos/*
            windows/*
